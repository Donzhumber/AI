name: Publicar documentos y dashboard

on:
  push:
    branches: [main]
    paths:
      - 'Principal/**'
      - 'Anexo_a/**'
      - 'Dashboard/**'
      - 'data/web/**'
      - 'data/preparar_web.py'
      - 'data/verificar_web.py'
      - 'data/datos/publicacion/dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preparar publicación compilada
        run: python data/preparar_web.py
      - name: Verificar páginas, recursos y agregados
        run: python data/verificar_web.py
      - name: Subir sitio preparado
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: data/_site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.1
